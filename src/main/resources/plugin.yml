name: Masquerade
version: '${project.version}'
main: io.mczju.masquerade.MasqueradePlugin
api-version: '26.2'
description: MCZJU 万圣节活动：易容术（变成方块 / 生物）
depend:
  - MCZJUItemCreator
commands:
  masq:
    description: 易容术管理指令（item / clear / end）
    usage: /masq <item|clear|end> ...
permissions:
  masquerade.admin:
    description: 使用 /masq item / clear（限 OP）
    default: op
  masquerade.use:
    description: 使用 /masq end 结束自己的变形
    default: true
